<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bohemian Wind</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* The same plane, ink and signal green as the application (app.css), written out here: this page must not
     need a second file. The cups are the application's own "working" sign. */
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #0A1210; color: #EAF2EE;
         font: 15px/1.5 "Lato", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(30rem, calc(100% - 3rem)); }
  .cups { width: 44px; height: 44px; color: #34C77B; display: block; margin-bottom: 1.25rem; animation: spin 1.1s linear infinite; }
  .stopped .cups { animation: none; color: #7E928A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .cups { animation-duration: 6s; } }
  h1 { margin: 0; font-size: 1.6rem; line-height: 1.25; font-weight: 700; }
  p { margin: .6rem 0 0; color: #B4C4BC; }
  .version { color: #7E928A; font-size: .85rem; margin-top: 1.5rem; }
  code { font: inherit; color: #EAF2EE; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="box" role="status" aria-live="polite">
  <svg class="cups" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="2.2" fill="currentColor" stroke="none"/><path d="M16 16V6.5M16 16l8.2 4.8M16 16l-8.2 4.8"/><circle cx="16" cy="4.6" r="2.8"/><circle cx="26.2" cy="22" r="2.8"/><circle cx="5.8" cy="22" r="2.8"/></svg>
  <h1 id="title">Bohemian Wind is starting</h1>
  <p id="msg">The window fills in by itself when it is ready.</p>
  <p id="slow" hidden>The first start after installing takes longer, up to a minute: the virus scanner of this computer reads the new files first. Later starts are quick.</p>
  <p id="log" hidden>Its messages are kept in <code>{{LOG}}</code></p>
  <p class="version">Bohemian Wind {{VERSION}}</p>
</main>
<script>
(function () {
  var started = Date.now(), misses = 0;
  var box = document.getElementById('box'), title = document.getElementById('title'), msg = document.getElementById('msg');
  var slow = document.getElementById('slow'), log = document.getElementById('log');
  function stop(head, text) {
    box.className = 'stopped';
    title.textContent = head;
    msg.textContent = text;
    slow.hidden = true;
    log.hidden = !log.querySelector('code').textContent;
  }
  function look() {
    fetch('/ping', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (p) {
      misses = 0;
      if (p.failed) { stop('Bohemian Wind could not start', p.failed); return; }
      if (!p.starting) { location.replace('/'); return; }
      if (Date.now() - started > 8000) { slow.hidden = false; }
      setTimeout(look, 500);
    }).catch(function () {
      misses += 1;
      if (misses > 10) { stop('Bohemian Wind has stopped', 'Close this window and start Bohemian Wind again.'); return; }
      setTimeout(look, 500);
    });
  }
  look();
})();
</script>
</body>
</html>
