name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            root: /tmp
            src: /tmp/src
            demo: /tmp/fixture/demo_data.csv
          - os: windows-latest
            root: 'D:\'
            src: 'D:\src'
            demo: 'D:\fixture\demo_data.csv'
    defaults:
      run:
        shell: bash
    steps:
      # Plain git rather than actions/checkout: it puts the code in a folder named after the repository, and a
      # Windows runner cannot make a folder whose name ends in a dot.
      - name: Check out
        working-directory: ${{ matrix.root }}
        run: |
          git init -q src
          cd src
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.src }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install rasterio || echo "rasterio is not available here: the atlas test is skipped"
      # The synthetic-mast tests plant known faults in a real year of mast data: brightwind's demo file (MIT licence),
      # taken from its published wheel and used here only, never copied into this repository. Nothing in the wheel is run.
      - name: Mast data for the synthetic-mast tests
        working-directory: ${{ matrix.root }}
        run: |
          pip download --no-deps --only-binary=:all: brightwind==2.7.0 -d fixture
          python -c "import hashlib, pathlib, zipfile; d = pathlib.Path('fixture'); z = zipfile.ZipFile(next(d.glob('brightwind-2.7.0-*.whl'))); raw = z.read(next(n for n in z.namelist() if n.endswith('/demo_data.csv'))); assert hashlib.sha256(raw).hexdigest() == 'd6e578c23e0244600aa3151eda8d55fd132135f3f69e0467abbba057c4779529', 'demo_data.csv is not the file the tests were written for'; (d / 'demo_data.csv').write_bytes(raw)"
      - name: Tests
        working-directory: ${{ matrix.src }}
        env:
          BW_DEMO_CSV: ${{ matrix.demo }}
        run: python -m pytest tests -q -rs
      - name: The demo project runs from the command line
        working-directory: ${{ matrix.src }}
        run: python main.py demo demo-project
      - name: The Windows start file sets itself up, runs, and starts fast the second time
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.src }}
        shell: cmd
        run: |
          call "Start Bohemian Wind.bat" demo demo-project-bat
          if errorlevel 1 exit /b 1
          call "Start Bohemian Wind.bat" run demo-project-bat pack
          if errorlevel 1 exit /b 1
          if not exist "demo-project-bat\permitting" exit /b 1
